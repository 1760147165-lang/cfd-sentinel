[metadata]
name = cfd-sentinel
version = 0.1.0
description = Preflight auditing, checkpoint hardening, and runtime alerts for CFD automation.
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
author = Yuhang
author_email = 244566510+1760147165-lang@users.noreply.github.com
url = https://github.com/1760147165-lang/cfd-sentinel
project_urls =
    Issues = https://github.com/1760147165-lang/cfd-sentinel/issues
keywords = CFD, ANSYS Fluent, automation, checkpoint, monitoring
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console
    Intended Audience :: Science/Research
    License :: OSI Approved :: Apache Software License
    Operating System :: Microsoft :: Windows
    Programming Language :: Python :: 3
    Topic :: Scientific/Engineering

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    cfd-sentinel = cfd_sentinel.cli:main
